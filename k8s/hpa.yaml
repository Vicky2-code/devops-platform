# Horizontal Pod Autoscaler — scales backend based on CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: devflow-backend-hpa
  namespace: devflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devflow-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70