name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and run ruff (backend)
        working-directory: backend
        run: |
          pip install ruff
          ruff check app tests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint

      - name: Shellcheck (CLI)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"

  # ---------------------------------------------------------------------------
  # Stage 2: tests
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -v

      - name: Test CLI (doctor)
        run: |
          chmod +x scripts/devflow
          ./scripts/devflow version
          ./scripts/devflow init demo-project
          test -f demo-project/README.md
          test -d demo-project/src
          test "$(cd demo-project && git branch --show-current)" = "main"

  # ---------------------------------------------------------------------------
  # Stage 3: build (frontend)
  # ---------------------------------------------------------------------------
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: frontend
        run: |
          npm install
          npm run build

  # ---------------------------------------------------------------------------
  # Stage 4: docker build + security scan + push
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build, scan & push
    runs-on: ubuntu-latest
    needs: [test, build]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY@L}" >> "$GITHUB_ENV"

      - name: Cache docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ github.sha }}
          restore-keys: buildx-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache

      - name: Container scan (backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-backend:latest
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Container scan (frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}-frontend:latest
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # Stage 5: deploy (placeholder that calls the real infra pipeline)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy & health check
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy stub
        run: |
          echo "Deployment hooked into infra pipeline"
          echo "-> push images then run terraform apply (see infra/terraform)"
          echo "-> or kubectl apply -f k8s/"

      - name: Health check
        run: |
          # Real healthcheck executed against the live deployment target;
          # configure DEPLOY_URL as a repository secret once infra exists.
          if [ -n "${{ secrets.DEPLOY_URL }}" ]; then
            curl -fsS --max-time 20 "${{ secrets.DEPLOY_URL }}/api/health"
          else
            echo "DEPLOY_URL not set - skipping live health check"
          fi